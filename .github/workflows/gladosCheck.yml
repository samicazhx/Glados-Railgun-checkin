name: glados-railgun-checkin

on:
  workflow_dispatch:
  push:
    branches: [ master ]
    paths-ignore:
      - 'README.md'
      - 'imgs/**'
  schedule:
    - cron: '17 11 * * *'      # UTC 11:17 = 北京时间 19:17

concurrency:
  group: glados-checkin
  cancel-in-progress: false

jobs:
  build:
    name: glados/railgun checkin
    runs-on: ubuntu-latest
    timeout-minutes: 120

    permissions:
      contents: read
      actions: write

    steps:
      - name: 随机延迟（仅定时触发，避开整点/半点）
        if: ${{ github.event_name == 'schedule' }}
        run: |
          DELAY=$(( RANDOM % 3600 ))
          MIN=$(TZ=Asia/Shanghai date -d "@$(( $(date +%s) + DELAY ))" +%M)
          if [ "$MIN" = "00" ] || [ "$MIN" = "30" ]; then
            DELAY=$(( DELAY + 60 + RANDOM % 240 ))
          fi
          echo "延迟 ${DELAY} 秒（约 $((DELAY / 60)) 分钟）"
          echo "预计执行：$(TZ=Asia/Shanghai date -d "@$(( $(date +%s) + DELAY ))")"
          sleep "$DELAY"

      - name: Checkout
        uses: actions/checkout@v4

      # ===== 把你原来 steps: 下面除延迟外的步骤粘贴到这里 =====
      # 注意：不要再写第二个 "steps:"，每一项以 "- " 开头，与上面的步骤同列缩进
      # 例如：
      # - name: Setup Python
      #   uses: actions/setup-python@v5
      #   with:
      #     python-version: '3.x'
      #
      # - name: checkin
      #   env:
      #     GLADOS_COOKIE: ${{ secrets.GLADOS_COOKIE }}
      #   run: python glados.py

      # 在这里接上你原来的签到步骤
      # - name: checkin
      #   run: python checkin.py

      # ===== 下面是你原有的步骤，原样放这里 =====
      - uses: actions/checkout@v4
      
    strategy:
      matrix:
        python-version: [3.13]

    # 这里加入全局环境变量，强制后续所有第三方 actions 兼容 Node.js 24 运行环境
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
    - name: Checkout Code
      uses: actions/checkout@v6

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}

    # 安装 python 库
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests
        pip install pypushdeer

    # 执行 签到脚本
    - name: Running checkin
      run: |
        python checkin.py
      env:
        PUSHDEER_SENDKEY: ${{ secrets.PUSHDEER_SENDKEY }}
        GLADOS_COOKIES: ${{ secrets.GLADOS_COOKIES }}
        GLADOS_EXCHANGE_PLAN: ${{ secrets.GLADOS_EXCHANGE_PLAN }}
        GLADOS_VERBOSE: ${{ secrets.GLADOS_VERBOSE }}

    - name: Keep alive
      uses: liskin/gh-workflow-keepalive@v1 
        
    - name: Delete workflow runs
      uses: Mattraks/delete-workflow-runs@v2
      with:
        token: ${{ github.token }}
        repository: ${{ github.repository }}
        retain_days: 7
        keep_minimum_runs: 7
        delete_run_by_conclusion_pattern: success
