name: glados-railgun-checkin

on:
  workflow_dispatch:
  push:
    branches: [ master ]
    paths-ignore:
      - 'README.md'
      - 'imgs/**'
  schedule:
    - cron: '17 11 * * *'      # UTC 11:17 = 北京时间 19:17

concurrency:
  group: glados-checkin
  cancel-in-progress: false

jobs:
  build:
    name: glados/railgun checkin
    runs-on: ubuntu-latest
    timeout-minutes: 120

    permissions:
      contents: read
      actions: write

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: 随机延迟（仅定时触发，避开整点/半点）
        if: ${{ github.event_name == 'schedule' }}
        run: |
          DELAY=$(( RANDOM % 3600 ))
          MIN=$(TZ=Asia/Shanghai date -d "@$(( $(date +%s) + DELAY ))" +%M)
          if [ "$MIN" = "00" ] || [ "$MIN" = "30" ]; then
            DELAY=$(( DELAY + 60 + RANDOM % 240 ))
          fi
          echo "延迟 ${DELAY} 秒（约 $((DELAY / 60)) 分钟）"
          echo "预计执行：$(TZ=Asia/Shanghai date -d "@$(( $(date +%s) + DELAY ))")"
          sleep "$DELAY"

      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests
          pip install pypushdeer

      # ↓↓↓ 从这里开始，粘贴你原文件第 85 行之后的步骤 ↓↓↓

    # 执行 签到脚本
    - name: Running checkin
      run: |
        python checkin.py
      env:
        PUSHDEER_SENDKEY: ${{ secrets.PUSHDEER_SENDKEY }}
        GLADOS_COOKIES: ${{ secrets.GLADOS_COOKIES }}
        GLADOS_EXCHANGE_PLAN: ${{ secrets.GLADOS_EXCHANGE_PLAN }}
        GLADOS_VERBOSE: ${{ secrets.GLADOS_VERBOSE }}

    - name: Keep alive
      uses: liskin/gh-workflow-keepalive@v1 
        
    - name: Delete workflow runs
      uses: Mattraks/delete-workflow-runs@v2
      with:
        token: ${{ github.token }}
        repository: ${{ github.repository }}
        retain_days: 7
        keep_minimum_runs: 7
        delete_run_by_conclusion_pattern: success
